name: saver
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  google_maps_flutter: ^2.2.0
  geolocator: ^10.1.0
  cupertino_icons: ^1.0.8
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_messaging: ^14.7.4
  cloud_functions: ^4.6.4
  flutter_local_notifications: ^17.2.1
  intl: ^0.18.1
  google_places_flutter: ^2.0.5
  http: ^0.13.5
  google_maps_webservice: ^0.0.20-nullsafety.5
  geocoding: ^2.1.0
  url_launcher: ^6.3.1
  country_code_picker: ^3.4.1
  sliding_up_panel: ^2.0.0+1
  dart_jsonwebtoken: ^3.3.1
  pointycastle: ^4.0.0
  jwt_decoder: ^2.0.1
  googleapis_auth: ^1.4.1
  shimmer: ^3.0.0
  shared_preferences: ^2.2.3
  lottie: ^3.0.0
  firebase_storage: ^11.6.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0




flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/markers/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logons.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logons.png"
  web:
    generate: true
    image_path: "assets/logons.png"
    background_color: "#ffffff"
    theme_color: "#2196F3"
  windows:
    generate: true
    image_path: "assets/logons.png"
    icon_size: 256
